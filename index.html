<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Works Lab — Build a resume that gets noticed</title>
    <meta name="description" content="ATS-friendly resume templates for Indian professionals. Create a polished resume in minutes. One-time payment. No subscription. ₹149." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <!-- Print target: a portal for the resume only (see downloadPDF() in
         Builder.tsx). Kept as a body-level sibling of #root — never nested
         inside the builder's CSS Grid layout or any scrolling ancestor — so
         the browser's print pipeline paginates it cleanly instead of
         emitting a blank page, which is what happens when a grid/scroll
         container is switched to print styles in place. -->
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
